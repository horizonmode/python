<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Delivery quotes{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
    {% include "deliveries/includes/theme.html" %}
</head>
<body class="flex min-h-screen flex-col">
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:bg-surface focus:p-4">Skip to content</a>
    <header class="border-b border-line bg-surface">
        <nav class="app-container flex flex-wrap items-center justify-between gap-4 py-6" aria-label="Main navigation">
            <a href="{% url 'home' %}" class="flex items-center gap-3 text-xl font-bold tracking-tight text-brand-900">
                <span aria-hidden="true" class="flex size-10 items-center justify-center rounded-xl bg-brand-700 font-display text-2xl text-white">p.</span>
                Parcel<span class="sr-only"> · Delivery quotes</span>
            </a>
            <a href="{% url 'home' %}" class="app-link text-sm">Delivery quotes</a>
        </nav>
    </header>
    <main id="main-content" class="app-container flex-1 py-10 sm:py-14">
        {% block content %}{% endblock %}
    </main>
    <footer class="app-container border-t border-line py-6 text-sm text-muted">
        Parcel · Simple quotes. Clear pricing.
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
