<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Delivery quotes{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <header class="border-b border-slate-200 bg-white">
        <nav class="mx-auto max-w-6xl px-4 py-5 sm:px-6" aria-label="Main navigation">
            <a href="{% url 'home' %}" class="text-lg font-bold tracking-tight text-indigo-700 hover:text-indigo-900 focus-visible:outline-2 focus-visible:outline-offset-4">Parcel · Delivery quotes</a>
        </nav>
    </header>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
