{# Shared Tailwind v4 tokens and components. Included once by base.html. #}
<style type="text/tailwindcss">
    @theme {
        --color-brand-50: #edf5f3;
        --color-brand-100: #d7e9e3;
        --color-brand-200: #aed0c3;
        --color-brand-600: #236551;
        --color-brand-700: #194e3e;
        --color-brand-900: #12392f;
        --color-canvas: #f6f5f0;
        --color-surface: #ffffff;
        --color-ink: #24372f;
        --color-muted: #5f7067;
        --color-line: #dce2da;
        --color-danger: #b42318;
        --font-sans: "Avenir Next", "Segoe UI", sans-serif;
        --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        --shadow-card: 0 4px 24px rgb(36 55 47 / 0.04);
    }
    @layer base {
        body { @apply bg-canvas font-sans text-ink antialiased; }
        :focus-visible { outline: 2px solid var(--color-brand-600); outline-offset: 3px; }
        ::selection { @apply bg-brand-100 text-brand-900; }
    }
    @layer components {
        .app-container { @apply mx-auto w-full max-w-6xl px-4 sm:px-8; }
        .page-title { @apply font-display text-4xl font-medium tracking-tight sm:text-5xl; }
        .section-title { @apply text-xl font-semibold tracking-tight; }
        .eyebrow { @apply text-xs font-bold uppercase tracking-widest text-brand-700; }
        .card { @apply rounded-2xl border border-line bg-surface shadow-card; }
        .button-primary {
            @apply inline-flex cursor-pointer items-center justify-center rounded-xl bg-brand-700 px-6 py-3 text-sm font-semibold text-white;
            @apply hover:bg-brand-900 disabled:cursor-wait disabled:opacity-60;
        }
        .form-input {
            @apply block w-full rounded-xl border border-line bg-surface px-4 py-3 text-base text-ink shadow-sm;
            @apply focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-100 aria-invalid:border-danger;
        }
        .app-link { @apply font-semibold text-brand-700 underline-offset-4 hover:underline; }
        .badge { @apply rounded-full bg-brand-50 px-3 py-1 text-xs font-semibold text-brand-700; }
        .notice-success { @apply rounded-xl border border-brand-200 bg-brand-50 p-6 text-brand-900; }
        .quote-table { @apply w-full whitespace-nowrap text-left text-sm; }
        .quote-table caption { @apply border-b border-line px-5 py-4 text-left text-muted; }
        .quote-table thead { @apply bg-canvas text-xs uppercase tracking-wider text-muted; }
        .quote-table th, .quote-table td { @apply px-5 py-4; }
        .quote-table tbody tr { @apply border-b border-line last:border-0 hover:bg-brand-50; }
        .empty-state { @apply rounded-2xl border border-dashed border-line bg-surface p-10 text-center text-muted; }
    }
</style>
